<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apna Bazar | Admin Dashboard</title>
  <style>
    :root { color-scheme: light; --green:#15803d; --dark:#14532d; --bg:#f1f5f9; --text:#0f172a; --muted:#64748b; --border:#e2e8f0; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Arial,sans-serif; }
    header { background:var(--dark); color:white; padding:18px 16px; }
    .top { max-width:1100px; margin:auto; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    h1 { font-size:22px; margin:0; } .sub { margin:5px 0 0; color:#dcfce7; font-size:13px; }
    button, select { font:inherit; }
    button { cursor:pointer; border:0; border-radius:8px; padding:10px 13px; font-weight:700; }
    .btn-light { background:white; color:var(--dark); } .btn-green { background:var(--green); color:white; } .btn-red { background:#fee2e2; color:#991b1b; }
    main { max-width:1100px; margin:20px auto; padding:0 12px 30px; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .toolbar input, .toolbar select { min-height:42px; border:1px solid #cbd5e1; border-radius:8px; padding:9px 11px; background:white; }
    .toolbar input { flex:1; min-width:180px; }
    .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:18px; }
    .stat, .order { background:white; border:1px solid var(--border); border-radius:12px; box-shadow:0 2px 8px #0f172a08; }
    .stat { padding:16px; } .stat span { display:block; color:var(--muted); font-size:13px; } .stat strong { display:block; font-size:24px; margin-top:8px; }
    #message { margin:12px 0; font-size:14px; line-height:1.5; }
    #orders { display:grid; gap:12px; }
    .order { padding:16px; }
    .order-head { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; border-bottom:1px solid var(--border); padding-bottom:12px; margin-bottom:12px; }
    .order-id { font-weight:800; overflow-wrap:anywhere; } .date { font-size:12px; color:var(--muted); margin-top:5px; }
    .badge {
  display: inline-block;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 800;
}

.badge-pending {
  background: #fee2e2;
  color: #b91c1c;
}

.badge-confirmed {
  background: #dcfce7;
  color: #166534;
}

.badge-delivered {
  background: #dbeafe;
  color: #1d4ed8;
}

.badge-cancelled {
  background: #e5e7eb;
  color: #374151;
                 }
    .details { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .label { color:var(--muted); font-size:12px; margin-bottom:4px; } .value { overflow-wrap:anywhere; white-space:pre-wrap; }
    .items { margin-top:12px; padding:12px; background:#f8fafc; border-radius:8px; font-size:14px; line-height:1.6; }
    .actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:14px; }
    .actions select { padding:9px; border:1px solid #cbd5e1; border-radius:8px; background:white; min-height:40px; }
    .empty { padding:28px; text-align:center; color:var(--muted); background:white; border-radius:12px; }
    .hidden { display:none !important; }
    @media(max-width:650px) { .stats { grid-template-columns:repeat(2,minmax(0,1fr)); } .details { grid-template-columns:1fr; } .stat strong { font-size:21px; } }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div><h1>🛒 Apna Bazar — Admin Dashboard</h1><p class="sub">Orders management · Fazilnagar</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn-light" id="refreshBtn" type="button">↻ Refresh</button>
        <button class="btn-light" id="logoutBtn" type="button">Logout</button>
      </div>
    </div>
  </header>

  <main>
    <div id="message" role="status">Checking admin login…</div>
    <section id="panel" class="hidden">
      <div class="stats">
        <div class="stat"><span>Total Orders</span><strong id="totalCount">0</strong></div>
        <div class="stat"><span>Pending</span><strong id="pendingCount">0</strong></div>
        <div class="stat"><span>Confirmed</span><strong id="confirmedCount">0</strong></div>
        <div class="stat"><span>Delivered</span><strong id="deliveredCount">0</strong></div>
      </div>

      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="Search name, phone or order ID…">
        <select id="statusFilter" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option>Pending</option><option>Confirmed</option><option>Delivered</option><option>Cancelled</option>
        </select>
      </div>
      <div id="orders"></div>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://jmumhmkodbwirtpfvokn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_YSwxb3pUBiQEOn66wtvmsg_W_A1yT2e";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $ = (selector) => document.querySelector(selector);
    const message = $("#message");
    const panel = $("#panel");
    let allOrders = [];

    function setMessage(text, isError = false) {
      message.textContent = text;
      message.style.color = isError ? "#b91c1c" : "#334155";
    }

    function safeText(value) {
      return value == null || value === "" ? "—" : String(value);
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
      })[char]);
    }

    function itemSummary(items) {
      if (!Array.isArray(items)) return "Order items unavailable";
      return items.map(item => {
        const name = escapeHTML(item.name || item.title || item.product_name || "Product");
        const qty = Number(item.quantity ?? item.qty ?? 1);
        const price = Number(item.price ?? 0);
        return `${name} × ${Number.isFinite(qty) ? qty : 1} — ₹${(Number.isFinite(price) ? price : 0).toFixed(2)}`;
      }).join("<br>") || "No item details";
    }

    function formatDate(value) {
      if (!value) return "Date unavailable";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? "Date unavailable" : date.toLocaleString("en-IN");
    }

    function renderOrders() {
      const search = $("#searchInput").value.trim().toLowerCase();
      const status = $("#statusFilter").value;
      const filtered = allOrders.filter(order => {
        const haystack = `${order.order_number || ""} ${order.customer_name || ""} ${order.customer_phone || ""}`.toLowerCase();
        return haystack.includes(search) && (!status || order.status === status);
      });

      $("#totalCount").textContent = allOrders.length;
      $("#pendingCount").textContent = allOrders.filter(o => o.status === "Pending").length;
      $("#confirmedCount").textContent = allOrders.filter(o => o.status === "Confirmed").length;
      $("#deliveredCount").textContent = allOrders.filter(o => o.status === "Delivered").length;

      const container = $("#orders");
      if (!filtered.length) {
        container.innerHTML = '<div class="empty">No orders found.</div>';
        return;
      }

      container.innerHTML = filtered.map(order => {
        const id = escapeHTML(order.id);
        const statusOptions = ["Pending", "Confirmed", "Delivered", "Cancelled"]
          .map(s => `<option value="${s}" ${order.status === s ? "selected" : ""}>${s}</option>`).join("");
        const phoneDigits = String(order.customer_phone || "").replace(/\D/g, "");
        const phoneLink = phoneDigits ? `tel:${phoneDigits}` : "#";
        return `
          <article class="order">
            <div class="order-head">
              <div><div class="order-id">Order ${escapeHTML(safeText(order.order_number))}</div>
              <div class="date">${escapeHTML(formatDate(order.created_at))}</div></div>
              <span class="badge">${escapeHTML(safeText(order.status))}</span>
            </div>
            <div class="details">
              <div><div class="label">Customer</div><div class="value">${escapeHTML(safeText(order.customer_name))}</div></div>
              <div><div class="label">Mobile</div><div class="value">${escapeHTML(safeText(order.customer_phone))}</div></div>
              <div><div class="label">Address</div><div class="value">${escapeHTML(safeText(order.customer_address))}</div></div>
              <div><div class="label">Payment</div><div class="value">${escapeHTML(safeText(order.payment_method))}</div></div>
              <div><div class="label">Total</div><div class="value"><strong>₹${Number(order.total_amount || 0).toFixed(2)}</strong></div></div>
            </div>
            <div class="items"><strong>Items</strong><br>${itemSummary(order.items)}</div>
            <div class="actions">
              <a href="${phoneDigits ? phoneLink : "#"}" ${phoneDigits ? "" : 'aria-disabled="true"'} style="text-decoration:none"><button class="btn-green" type="button" ${phoneDigits ? "" : "disabled"}>📞 Call customer</button></a>
              <select data-status-id="${id}" aria-label="Change order status">${statusOptions}</select>
              <button class="btn-green" data-save-id="${id}" type="button">Save status</button>
            </div>
          </article>`;
      }).join("");

      container.querySelectorAll("[data-save-id]").forEach(button => {
        button.addEventListener("click", () => updateStatus(button.dataset.saveId));
      });
    }

    async function verifyAdmin() {
      const { data: { session }, error: sessionError } = await supabase.auth.getSession();
      if (sessionError || !session) {
        location.replace("/admin.html");
        return false;
      }

      const { data: admin, error } = await supabase
        .from("admins").select("user_id").eq("user_id", session.user.id).maybeSingle();

      if (error || !admin) {
        await supabase.auth.signOut();
        location.replace("/admin.html");
        return false;
      }
      return true;
    }

    async function loadOrders() {
      setMessage("Loading orders…");
      $("#refreshBtn").disabled = true;
      try {
        const { data, error } = await supabase
          .from("orders")
          .select("id, order_number, customer_name, customer_phone, customer_address, items, total_amount, payment_method, status, created_at")
          .order("created_at", { ascending: false });
        if (error) throw error;
        allOrders = data || [];
        panel.classList.remove("hidden");
        setMessage(`${allOrders.length} order(s) loaded.`);
        renderOrders();
      } catch (error) {
        setMessage(`Could not load orders: ${error.message}. Check orders SELECT policy for authenticated admins.`, true);
      } finally {
        $("#refreshBtn").disabled = false;
      }
    }

    async function updateStatus(id) {
      const select = document.querySelector(`[data-status-id="${CSS.escape(String(id))}"]`);
      if (!select) return;
      const status = select.value;
      const button = document.querySelector(`[data-save-id="${CSS.escape(String(id))}"]`);
      button.disabled = true;
      try {
        const { error } = await supabase.from("orders").update({ status }).eq("id", id);
        if (error) throw error;
        const order = allOrders.find(o => String(o.id) === String(id));
        if (order) order.status = status;
        setMessage("Order status updated successfully.");
        renderOrders();
      } catch (error) {
        setMessage(`Could not update status: ${error.message}. Check orders UPDATE policy.`, true);
      } finally {
        const currentButton = document.querySelector(`[data-save-id="${CSS.escape(String(id))}"]`);
        if (currentButton) currentButton.disabled = false;
      }
    }

    $("#refreshBtn").addEventListener("click", loadOrders);
    $("#searchInput").addEventListener("input", renderOrders);
    $("#statusFilter").addEventListener("change", renderOrders);
    $("#logoutBtn").addEventListener("click", async () => {
      await supabase.auth.signOut();
      location.replace("/admin.html");
    });

    if (await verifyAdmin()) await loadOrders();
    else setMessage("Please log in as an authorized admin.", true);
  </script>
</body>
</html>
