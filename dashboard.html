<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apna Bazar | Admin Dashboard</title>
<style>
:root{color-scheme:light;--green:#15803d;--dark:#14532d;--bg:#f1f5f9;--text:#0f172a;--muted:#64748b;--border:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{background:var(--dark);color:white;padding:16px}
.top{max-width:1100px;margin:auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:21px;margin:0}.sub{font-size:13px;color:#dcfce7}
main{max-width:1100px;margin:20px auto;padding:0 12px 30px}
button,select,input,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 13px;font-weight:700}
button:disabled{opacity:.55;cursor:wait}
.btn-light{background:white;color:var(--dark)}.btn-green{background:var(--green);color:white}
.btn-red{background:#fee2e2;color:#991b1b}.btn-blue{background:#dbeafe;color:#1d4ed8}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{background:white;color:#334155;border:1px solid var(--border)}
.tab.active{background:var(--green);color:white}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat,.card,.order,.product{background:white;border:1px solid var(--border);border-radius:12px;padding:15px}
.stat span{display:block;color:var(--muted);font-size:13px}
.stat strong{display:block;font-size:23px;margin-top:7px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea{width:100%;min-height:42px;border:1px solid #cbd5e1;border-radius:8px;padding:10px;background:white}
.toolbar input{flex:1;min-width:170px}
#message{margin:12px 0;font-size:14px;line-height:1.5}
.hidden{display:none!important}
#orders,#products{display:grid;gap:12px}
.order-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:12px}
.order-id{font-weight:800;overflow-wrap:anywhere}
.date,.label{color:var(--muted);font-size:12px;margin-top:5px}
.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.value{overflow-wrap:anywhere;white-space:pre-wrap}
.items{margin-top:12px;padding:12px;background:#f8fafc;border-radius:8px;font-size:14px;line-height:1.6}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.actions select{width:auto;min-width:130px}
.badge{display:inline-block;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:800}
.badge-pending{background:#fee2e2;color:#b91c1c}
.badge-confirmed{background:#dcfce7;color:#166534}
.badge-delivered{background:#dbeafe;color:#1d4ed8}
.badge-cancelled{background:#e5e7eb;color:#374151}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field.full{grid-column:1/-1}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.product{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.product img{width:95px;height:95px;object-fit:cover;border-radius:9px;background:#f1f5f9}
.product-info{flex:1;min-width:160px}
.product-info h3{margin:0 0 7px;font-size:17px}
.product-info p{margin:5px 0;font-size:14px;overflow-wrap:anywhere}
.empty{padding:25px;text-align:center;color:var(--muted);background:white;border-radius:12px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.details,.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.product img{width:75px;height:75px}}
</style>
</head>
<body>
<header>
 <div class="top">
  <div><h1>🛒 Apna Bazar — Admin</h1><p class="sub">Fazilnagar · Orders & Products</p></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
   <button class="btn-light" id="refreshBtn">↻ Refresh</button>
   <button class="btn-light" id="logoutBtn">Logout</button>
  </div>
 </div>
</header>

<main>
 <div id="message" role="status">Checking admin login…</div>
 <section id="panel" class="hidden">
  <div class="tabs">
   <button class="tab active" data-tab="ordersSection">📦 Orders</button>
   <button class="tab" data-tab="productsSection">🛍️ Products</button>
  </div>

  <section id="ordersSection">
   <div class="stats">
    <div class="stat"><span>Total Orders</span><strong id="totalCount">0</strong></div>
    <div class="stat"><span>Pending</span><strong id="pendingCount">0</strong></div>
    <div class="stat"><span>Confirmed</span><strong id="confirmedCount">0</strong></div>
    <div class="stat"><span>Delivered</span><strong id="deliveredCount">0</strong></div>
   </div>
   <div class="toolbar">
    <input id="searchInput" type="search" placeholder="Search name, phone or order ID…">
    <select id="statusFilter">
     <option value="">All statuses</option>
     <option>Pending</option><option>Confirmed</option><option>Delivered</option><option>Cancelled</option>
    </select>
   </div>
   <div id="orders"></div>
  </section>

  <section id="productsSection" class="hidden">
   <div class="card" style="margin-bottom:15px">
    <h2 id="formTitle" style="margin-top:0">➕ Add New Product</h2>
    <form id="productForm">
     <input type="hidden" id="productId">
     <div class="form-grid">
      <div class="field"><label for="pName">Product name *</label><input id="pName" required maxlength="150" placeholder="e.g. Fresh Aata 5kg"></div>
      <div class="field"><label for="pPrice">Price (₹) *</label><input id="pPrice" type="number" required min="0" step="0.01" placeholder="100"></div>
      <div class="field"><label for="pCategory">Category</label><input id="pCategory" maxlength="100" placeholder="Grocery"></div>
      <div class="field"><label for="pStock">Stock quantity *</label><input id="pStock" type="number" required min="0" step="1" value="0"></div>
      <div class="field full"><label for="pImage">Product image URL</label><input id="pImage" type="url" placeholder="https://example.com/product.jpg"></div>
      <div class="field full"><label for="pDescription">Description</label><textarea id="pDescription" rows="3" maxlength="2000" placeholder="Product details"></textarea></div>
      <div class="field full"><label><input id="pActive" type="checkbox" checked style="width:auto;min-height:auto"> Show this product to customers</label></div>
     </div>
     <div class="form-actions">
      <button class="btn-green" id="saveProductBtn" type="submit">Save Product</button>
      <button class="btn-light" id="cancelEditBtn" type="button">Clear Form</button>
     </div>
    </form>
   </div>

   <div class="toolbar">
    <input id="productSearch" type="search" placeholder="Search products…">
    <select id="productFilter">
     <option value="all">All products</option>
     <option value="active">Visible products</option>
     <option value="hidden">Hidden products</option>
    </select>
   </div>
   <div id="products"></div>
  </section>
 </section>
</main>

<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL="https://jmumhmkodbwirtpfvokn.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_YSwxb3pUBiQEOn66wtvmsg_W_A1yT2e";
const supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=s=>document.querySelector(s);
let allOrders=[],allProducts=[],isAdmin=false;

function setMessage(text,error=false){
 $("#message").textContent=text;
 $("#message").style.color=error?"#b91c1c":"#334155";
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function safe(v){return v==null||v===""?"—":String(v);}
function dateText(v){const d=new Date(v);return v&&!Number.isNaN(d.getTime())?d.toLocaleString("en-IN"):"Date unavailable";}
function money(v){return "₹"+Number(v||0).toFixed(2);}

async function verifyAdmin(){
 const {data:{session},error:sessionError}=await supabase.auth.getSession();
 if(sessionError||!session){location.replace("/admin.html");return false;}
 const {data:admin,error}=await supabase.from("admins").select("user_id").eq("user_id",session.user.id).maybeSingle();
 if(error||!admin){await supabase.auth.signOut();location.replace("/admin.html");return false;}
 isAdmin=true;return true;
}

function itemSummary(items){
 if(!Array.isArray(items))return "Order items unavailable";
 return items.map(i=>`${esc(i.name||i.title||i.product_name||"Product")} × ${Number(i.quantity??i.qty??1)||1} — ${money(i.price)}`).join("<br>")||"No item details";
}

async function loadOrders(){
 setMessage("Loading orders…");
 $("#refreshBtn").disabled=true;
 try{
  const {data,error}=await supabase.from("orders")
   .select("id,order_number,customer_name,customer_phone,customer_address,items,total_amount,payment_method,status,created_at")
   .order("created_at",{ascending:false});
  if(error)throw error;
  allOrders=data||[];
  $("#totalCount").textContent=allOrders.length;
  $("#pendingCount").textContent=allOrders.filter(o=>o.status==="Pending").length;
  $("#confirmedCount").textContent=allOrders.filter(o=>o.status==="Confirmed").length;
  $("#deliveredCount").textContent=allOrders.filter(o=>o.status==="Delivered").length;
  renderOrders();
  setMessage(`${allOrders.length} order(s) loaded.`);
 }catch(e){setMessage("Orders load nahi hue: "+e.message,true);}
 finally{$("#refreshBtn").disabled=false;}
}

function renderOrders(){
 const search=$("#searchInput").value.trim().toLowerCase(),status=$("#statusFilter").value;
 const list=allOrders.filter(o=>`${o.order_number||""} ${o.customer_name||""} ${o.customer_phone||""}`.toLowerCase().includes(search)&&(!status||o.status===status));
 if(!list.length){$("#orders").innerHTML='<div class="empty">No orders found.</div>';return;}
 $("#orders").innerHTML=list.map(o=>{
  const phone=String(o.customer_phone||"").replace(/\D/g,"");
  const opts=["Pending","Confirmed","Delivered","Cancelled"].map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("");
  return `<article class="order">
   <div class="order-head"><div><div class="order-id">Order ${esc(safe(o.order_number))}</div><div class="date">${esc(dateText(o.created_at))}</div></div>
   <span class="badge badge-${esc(String(o.status||"pending").toLowerCase())}">${esc(safe(o.status))}</span></div>
   <div class="details">
    <div><div class="label">Customer</div><div>${esc(safe(o.customer_name))}</div></div>
    <div><div class="label">Mobile</div><div>${esc(safe(o.customer_phone))}</div></div>
    <div><div class="label">Address</div><div class="value">${esc(safe(o.customer_address))}</div></div>
    <div><div class="label">Payment</div><div>${esc(safe(o.payment_method))}</div></div>
    <div><div class="label">Total</div><strong>${money(o.total_amount)}</strong></div>
   </div>
   <div class="items"><strong>Items</strong><br>${itemSummary(o.items)}</div>
   <div class="actions">
    ${phone?`<a href="tel:${phone}"><button class="btn-green" type="button">📞 Call customer</button></a>`:""}
    <select data-status="${esc(o.id)}" aria-label="Order status">${opts}</select>
    <button class="btn-green" data-save-order="${esc(o.id)}">Save status</button>
   </div></article>`;
 }).join("");
 $("#orders").querySelectorAll("[data-save-order]").forEach(b=>b.addEventListener("click",()=>updateStatus(b.dataset.saveOrder)));
}

async function updateStatus(id){
 const select=$("#orders").querySelector(`[data-status="${CSS.escape(String(id))}"]`);
 if(!select)return;
 const status=select.value;
 try{
  const {error}=await supabase.from("orders").update({status}).eq("id",id);
  if(error)throw error;
  const order=allOrders.find(o=>String(o.id)===String(id));
  if(order)order.status=status;
  setMessage("Order status updated.");
  await loadOrders();
 }catch(e){setMessage("Status update failed: "+e.message,true);}
}

function resetProductForm(){
 $("#productForm").reset();$("#productId").value="";
 $("#pStock").value="0";$("#pActive").checked=true;
 $("#formTitle").textContent="➕ Add New Product";
 $("#saveProductBtn").textContent="Save Product";
}
function editProduct(p){
 $("#productId").value=p.id;$("#pName").value=p.name||"";
 $("#pPrice").value=p.price;$("#pCategory").value=p.category||"";
 $("#pStock").value=p.stock;$("#pImage").value=p.image_url||"";
 $("#pDescription").value=p.description||"";$("#pActive").checked=!!p.is_active;
 $("#formTitle").textContent="✏️ Edit Product";
 $("#saveProductBtn").textContent="Update Product";
 $("#productsSection").scrollIntoView({behavior:"smooth"});
}

async function loadProducts(){
 setMessage("Loading products…");
 try{
  // Admin RLS policy permits admins to see active and hidden products.
  const {data,error}=await supabase.from("products")
   .select("id,name,description,price,category,image_url,stock,is_active,created_at,updated_at")
   .order("created_at",{ascending:false});
  if(error)throw error;
  allProducts=data||[];renderProducts();
  setMessage(`${allProducts.length} product(s) loaded.`);
 }catch(e){setMessage("Products load nahi hue: "+e.message+" — Supabase products table aur admin policies check karein.",true);}
}

function renderProducts(){
 const q=$("#productSearch").value.trim().toLowerCase(),filter=$("#productFilter").value;
 const list=allProducts.filter(p=>(`${p.name} ${p.category||""} ${p.description||""}`).toLowerCase().includes(q)&&(filter==="all"||(filter==="active"&&p.is_active)||(filter==="hidden"&&!p.is_active)));
 if(!list.length){$("#products").innerHTML='<div class="empty">No products found.</div>';return;}
 $("#products").innerHTML=list.map(p=>`<article class="product">
  ${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none'">`:'<div style="width:95px;height:95px;border-radius:9px;background:#f1f5f9;display:grid;place-items:center">🛍️</div>'}
  <div class="product-info">
   <h3>${esc(p.name)}</h3>
   <p><strong>${money(p.price)}</strong> · Stock: ${Number(p.stock)} · ${esc(p.category||"General")}</p>
   <p>${esc(p.description||"")}</p>
   <p><span class="badge" style="background:${p.is_active?"#dcfce7":"#e5e7eb"};color:${p.is_active?"#166534":"#374151"}">${p.is_active?"Visible":"Hidden"}</span></p>
   <div class="actions">
    <button class="btn-blue" data-edit="${esc(p.id)}">✏️ Edit</button>
    <button class="btn-green" data-toggle="${esc(p.id)}">${p.is_active?"Hide":"Show"}</button>
    <button class="btn-red" data-delete="${esc(p.id)}">🗑️ Delete</button>
   </div>
  </div></article>`).join("");
 $("#products").querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>{const p=allProducts.find(x=>String(x.id)===b.dataset.edit);if(p)editProduct(p);}));
 $("#products").querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",()=>toggleProduct(b.dataset.toggle)));
 $("#products").querySelectorAll("[data-delete]").forEach(b=>b.addEventListener("click",()=>deleteProduct(b.dataset.delete)));
}

$("#productForm").addEventListener("submit",async e=>{
 e.preventDefault();
 if(!isAdmin)return setMessage("Admin login required.",true);
 const id=$("#productId").value;
 const name=$("#pName").value.trim(),price=Number($("#pPrice").value),stock=Number($("#pStock").value);
 if(!name||!Number.isFinite(price)||price<0||!Number.isInteger(stock)||stock<0){return setMessage("Name, valid price aur stock bharna zaroori hai.",true);}
 const payload={name,price,stock,category:$("#pCategory").value.trim()||"General",image_url:$("#pImage").value.trim(),description:$("#pDescription").value.trim(),is_active:$("#pActive").checked,updated_at:new Date().toISOString()};
 const btn=$("#saveProductBtn");btn.disabled=true;
 try{
  const result=id?await supabase.from("products").update(payload).eq("id",id):await supabase.from("products").insert(payload);
  if(result.error)throw result.error;
  setMessage(id?"Product updated successfully.":"Product added successfully.");
  resetProductForm();await loadProducts();
 }catch(e){setMessage("Product save nahi hua: "+e.message,true);}
 finally{btn.disabled=false;}
});

async function toggleProduct(id){
 const p=allProducts.find(x=>String(x.id)===String(id));if(!p)return;
 try{
  const {error}=await supabase.from("products").update({is_active:!p.is_active,updated_at:new Date().toISOString()}).eq("id",id);
  if(error)throw error;
  setMessage("Product visibility updated.");await loadProducts();
 }catch(e){setMessage("Visibility update failed: "+e.message,true);}
}
async function deleteProduct(id){
 const p=allProducts.find(x=>String(x.id)===String(id));if(!p)return;
 if(!confirm(`"${p.name}" ko permanently delete karna hai?`))return;
 try{
  const {error}=await supabase.from("products").delete().eq("id",id);
  if(error)throw error;
  setMessage("Product deleted.");await loadProducts();
 }catch(e){setMessage("Delete failed: "+e.message,true);}
}

document.querySelectorAll("[data-tab]").forEach(btn=>btn.addEventListener("click",()=>{
 document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b===btn));
 $("#ordersSection").classList.toggle("hidden",btn.dataset.tab!=="ordersSection");
 $("#productsSection").classList.toggle("hidden",btn.dataset.tab!=="productsSection");
 if(btn.dataset.tab==="productsSection")loadProducts();
}));
$("#cancelEditBtn").addEventListener("click",resetProductForm);
$("#searchInput").addEventListener("input",renderOrders);
$("#statusFilter").addEventListener("change",renderOrders);
$("#productSearch").addEventListener("input",renderProducts);
$("#productFilter").addEventListener("change",renderProducts);
$("#refreshBtn").addEventListener("click",async()=>{
 if($("#productsSection").classList.contains("hidden"))await loadOrders();
 else await loadProducts();
});
$("#logoutBtn").addEventListener("click",async()=>{await supabase.auth.signOut();location.replace("/admin.html");});

if(await verifyAdmin()){
 $("#panel").classList.remove("hidden");
 await loadOrders();
}else setMessage("Please log in as an authorized admin.",true);
</script>
</body>
  </html>
